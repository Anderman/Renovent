name: Publish OTA Artifacts

on:
  push:
    branches:
      - main
    paths-ignore:
      - release/**
      - src/build_info.generated.h
      - data/version.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Generate shared build id
        run: echo "RENOVENT_BUILD_ID=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_ENV"

      - name: Build firmware
        run: pio run -e esp32s3mini_ota

      - name: Build SPIFFS image
        run: pio run -e esp32s3mini_ota -t buildfs

      - name: Stage OTA artifacts
        run: |
          mkdir -p release/firmware release/spiffs
          cp .pio/build/esp32s3mini_ota/firmware.bin "release/firmware/${RENOVENT_BUILD_ID}.bin"
          cp .pio/build/esp32s3mini_ota/spiffs.bin "release/spiffs/${RENOVENT_BUILD_ID}.bin"
          cat > release/latest.json <<EOF
          {
            "generatedAt": "${RENOVENT_BUILD_ID}",
            "firmware": {
              "buildId": "${RENOVENT_BUILD_ID}",
              "downloadUrl": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/release/firmware/${RENOVENT_BUILD_ID}.bin"
            },
            "spiffs": {
              "buildId": "${RENOVENT_BUILD_ID}",
              "downloadUrl": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/release/spiffs/${RENOVENT_BUILD_ID}.bin"
            }
          }
          EOF

      - name: Commit OTA artifacts
        run: |
          git add release/firmware release/spiffs release/latest.json src/build_info.generated.h data/version.txt
          if git diff --cached --quiet; then
            echo "No OTA artifact changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish OTA artifacts ${RENOVENT_BUILD_ID} [skip ci]"
          git push
